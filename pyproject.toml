[project]
name = "weather-pipe"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "geopy>=2.5.0",
    "httpx>=0.28.1",
    "psycopg2>=2.9.13",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pyproj>=3.8.0",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "integration: tests against an already running, migrated PostgreSQL (enable with --run-integration)",
]

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]
